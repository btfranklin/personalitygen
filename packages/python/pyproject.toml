[project]
name = "personalitygen"
dynamic = ["version"]
description = "Generate simulated character personalities for games, stories, and simulations."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "B.T. Franklin", email = "brandon.franklin@gmail.com"},
]
keywords = [
    "personality",
    "big-five",
    "ocean",
    "abbf",
    "character-generation",
    "procedural-generation",
    "games",
    "simulation",
]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/btfranklin/personalitygen"
Issues = "https://github.com/btfranklin/personalitygen/issues"
Changelog = "https://github.com/btfranklin/personalitygen/releases"
Repository = "https://github.com/btfranklin/personalitygen.git"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "mypy>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"

[tool.pdm.build]
excludes = ["tests/**"]

[tool.pdm.scripts]
test = "pytest"
lint = "ruff check src tests examples scripts"
typecheck = "mypy --strict src tests/typecheck/random_source_consumer.py"
build-package = "pdm build"
verify-package = "python scripts/verify_package.py"
check = {composite = [
    "lint",
    "typecheck",
    "test",
    "build-package",
    "verify-package",
]}
