# Publish the built Python package to PyPI when a GitHub Release is published.
# For more information, see https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing release tag to publish
                required: true
                type: string

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.release_tag || github.event.release.tag_name }}
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
            - uses: pdm-project/setup-pdm@v4
            - name: Build package
              working-directory: packages/python
              run: pdm build
            - name: Verify release tag
              working-directory: packages/python
              env:
                  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
              run: |
                  [[ "$RELEASE_TAG" == v* ]]
                  test -f "dist/personalitygen-${RELEASE_TAG#v}-py3-none-any.whl"
            - name: Publish package with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: packages/python/dist/
