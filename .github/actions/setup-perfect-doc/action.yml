name: Set up Perfect Doc
description: Install the verified Linux executable for documentation checks.
runs:
    using: composite
    steps:
        - name: Install Perfect Doc
          shell: bash
          working-directory: ${{ runner.temp }}
          env:
              PERFECT_DOC_URL: https://github.com/btfranklin/perfect-doc/releases/download/v0.1.0/perfect-doc-0.1.0-x86_64-unknown-linux-gnu.tar.gz
              PERFECT_DOC_SHA256: 80da73f3a01ab1301539561812d81213112187e71ad4ee630a0d70e95692cd22
          run: |
              curl --fail --location "$PERFECT_DOC_URL" --output perfect-doc.tar.gz
              printf '%s  %s\n' "$PERFECT_DOC_SHA256" perfect-doc.tar.gz | sha256sum --check
              mkdir -p perfect-doc-bin
              tar -xzf perfect-doc.tar.gz -C perfect-doc-bin --strip-components=1
              echo "$RUNNER_TEMP/perfect-doc-bin" >> "$GITHUB_PATH"
