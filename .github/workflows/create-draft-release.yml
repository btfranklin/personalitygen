name: Create Draft Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

jobs:
    python-validation:
        uses: ./.github/workflows/python-package.yml
    typescript-validation:
        uses: ./.github/workflows/typescript-package.yml

    draft-release:
        needs: [python-validation, typescript-validation]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
            - name: Create draft release with generated notes
              uses: btfranklin/release-notes-scribe@v0
              with:
                  openai_api_key: ${{ secrets.OPENAI_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  include_github_generated_notes: "true"
                  create_release: "true"
                  draft: "true"
