name: Publish packages

on:
    release:
        types: [published]

permissions:
    contents: read

env:
    RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.release.tag_name }}
            - name: Set up Python 3.11
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: false
            - name: Build Python distributions
              working-directory: packages/python
              run: |
                  pdm build --dest release-dist
                  test -f "release-dist/personalitygen-${RELEASE_TAG#v}.tar.gz"
                  test -f "release-dist/personalitygen-${RELEASE_TAG#v}-py3-none-any.whl"
            - name: Set up Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: packages/typescript/package-lock.json
            - name: Build npm package
              working-directory: packages/typescript
              run: |
                  npm ci --ignore-scripts
                  npm run verify:release-tag
                  npm run build
                  mkdir -p release-dist
                  npm pack --ignore-scripts --pack-destination release-dist
                  test -f "release-dist/personalitygen-${RELEASE_TAG#v}.tgz"
            - name: Upload Python distributions
              uses: actions/upload-artifact@v7
              with:
                  name: python-distributions
                  path: packages/python/release-dist/*
                  if-no-files-found: error
            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: packages/typescript/release-dist/*.tgz
                  if-no-files-found: error

    publish-python:
        needs: build
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download Python distributions
              uses: actions/download-artifact@v8
              with:
                  name: python-distributions
                  path: python-distributions
            - name: Publish Python artifacts with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: python-distributions/

    publish-typescript:
        needs: build
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Set up Node.js 24 for Trusted Publishing
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Download npm package
              uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: npm-package
            - name: Publish npm artifact with Trusted Publishing
              run: |
                  package="npm-package/personalitygen-${RELEASE_TAG#v}.tgz"
                  test -f "$package"
                  npm publish "./$package" --ignore-scripts --provenance --access public
